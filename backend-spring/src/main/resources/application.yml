server:
  port: 8080

spring:
  application:
    name: eduemsi-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eduemsi_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Google Gemini Flash Free Tier Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY:FREE_TIER_DEMO_KEY}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
    fallback-enabled: true

# EMSI Academic Constraints
emsi:
  constraints:
    morning-break-minutes: 15
    max-midday-gap-minutes: 90
    max-absences-threshold-percent: 20
    alert-absences-threshold-percent: 15
